name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK and SDK Packages
        # Download both the WDK and the matching SDK into the packages folder. 
        # This provides all required kernel headers (wdm.h) and build tools independent of the runner's built-in SDKs.
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.28000.2526 -OutputDirectory packages
          nuget install Microsoft.Windows.SDK.CPP.x64 -Version 10.0.28000.2526 -OutputDirectory packages

      - name: Enforce Architecture and SDK Version
        shell: powershell
        # MSBuild automatically loads Directory.Build.props.
        # We override the project's hardcoded 10.0.26100.0 requirement to 10.0.28000.0 to match the downloaded packages.
        # We also lock the host architecture to x64 to prevent the WDK targets from falling back to ARM64 tools.
        run: |
          $props = @"
          <Project>
            <PropertyGroup>
              <WindowsTargetPlatformVersion>10.0.28000.0</WindowsTargetPlatformVersion>
              <HostArchitecture>x64</HostArchitecture>
              <HostMachineOS>x64</HostMachineOS>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props

      - name: Build Driver (KMDF)
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
