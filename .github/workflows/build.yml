name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Explicitly Install WDK NuGet Package
        # This downloads the WDK directly into the "packages" folder so the .vcxproj can find wdm.h and the build tools.
        run: nuget install Microsoft.Windows.WDK.x64 -Version 10.0.28000.2526 -OutputDirectory packages

      - name: Build Driver (KMDF)
        # Passing HostArchitecture overrides the blank environment variables in GitHub Actions, forcing MSBuild to use the x64 tools (like x64\stampinf.exe) instead of ARM64.
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
