name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore rt1011.sln

      - name: WDK Diagnostics and Tool Path Verification
        shell: powershell
        run: |
          echo "=== MSBuild Properties Setup ==="
          # Define the exact properties we will use to build
          $props = "/p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64"
          
          # Query MSBuild properties directly from the driver project
          $platform = msbuild rt1011/rt1011.vcxproj -getProperty:Platform $props
          $config = msbuild rt1011/rt1011.vcxproj -getProperty:Configuration $props
          $winsdk = msbuild rt1011/rt1011.vcxproj -getProperty:WindowsSdkDir $props
          $winsdkver = msbuild rt1011/rt1011.vcxproj -getProperty:WindowsSDKVersion $props
          $wdkbin = msbuild rt1011/rt1011.vcxproj -getProperty:WdkBinRoot $props
          $stampinf = msbuild rt1011/rt1011.vcxproj -getProperty:StampInfToolPath $props
          $inf2cat = msbuild rt1011/rt1011.vcxproj -getProperty:Inf2CatToolPath $props
          $signtool = msbuild rt1011/rt1011.vcxproj -getProperty:SignToolPath $props
          
          echo "Platform: $platform"
          echo "Configuration: $config"
          echo "WindowsSdkDir: $winsdk"
          echo "WindowsSDKVersion: $winsdkver"
          echo "WdkBinRoot: $wdkbin"
          
          echo "=== Locating Exact WDK Tools ==="
          if (-not [string]::IsNullOrWhiteSpace($wdkbin) -and (Test-Path "$wdkbin")) {
             echo "Listing available StampInf binaries on disk:"
             Get-ChildItem -Path $wdkbin -Recurse -Filter "stampinf.exe" | Select-Object FullName
          }

          echo "Evaluated StampInf Path: $stampinf"
          echo "Evaluated Inf2Cat Path: $inf2cat"
          echo "Evaluated SignTool Path: $signtool"
          
          echo "=== Architecture Safety Check ==="
          # Fallback check if StampInfToolPath evaluated empty
          $checkPath = if ([string]::IsNullOrWhiteSpace($stampinf)) { "x64\stampinf.exe" } else { $stampinf }
          
          if ($checkPath -match "ARM64") {
            Write-Error "Validation Failed: The workflow is configured to use the ARM64 stampinf.exe tool, which will trigger FileTracker error 0xd8!"
            exit 1
          } else {
            Write-Host "Validation Passed: ARM64 stampinf.exe is NOT selected. x64 host tool is properly enforced." -ForegroundColor Green
          }

      - name: Build Driver (KMDF)
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
