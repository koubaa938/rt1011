name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inject PackageReferences and Architecture Properties
        shell: powershell
        # This replaces the standalone `nuget install` step.
        # By setting RestoreProjectStyle to PackageReference, MSBuild will natively download 
        # the SDK/WDK packages during the restore step and automatically configure internal 
        # path variables (like WindowsSdkDir) to point to them instead of the system registry.
        run: |
          $props = @"
          <Project>
            <PropertyGroup>
              <RestoreProjectStyle>PackageReference</RestoreProjectStyle>
              <RestorePackagesProjectStyle>PackageReference</RestorePackagesProjectStyle>
              
              <WindowsTargetPlatformVersion>10.0.28000.0</WindowsTargetPlatformVersion>
              <HostArchitecture>x64</HostArchitecture>
              <HostMachineOS>x64</HostMachineOS>
            </PropertyGroup>
            
            <ItemGroup>
              <PackageReference Include="Microsoft.Windows.WDK.x64" Version="10.0.28000.2526" />
              <PackageReference Include="Microsoft.Windows.WDK.x86" Version="10.0.28000.2526" />
              <PackageReference Include="Microsoft.Windows.SDK.CPP.x64" Version="10.0.28000.2526" />
              <PackageReference Include="Microsoft.Windows.SDK.CPP" Version="10.0.28000.2526" />
            </ItemGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props

      - name: Restore NuGet Packages (MSBuild)
        # This step parses Directory.Build.props, downloads the packages, and generates 
        # the obj/project.assets.json file required to wire up the SDK headers and tools.
        run: |
          msbuild /t:restore rt1011.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Configure WDK host tools (x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching for restored Microsoft.Windows.WDK.x64 package...'

          $global = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windows.wdk.x64'

          Write-Host "NuGet WDK cache: $global"

          if (-not (Test-Path $global)) {
            throw "WDK NuGet cache does not exist: $global"
          }

          $versionDir = Get-ChildItem $global -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $versionDir) {
            throw "No WDK package version found under: $global"
          }

          $wdkPackage = $versionDir
          Write-Host "WDK package found: $($wdkPackage.FullName)"

          Write-Host "WDK package found: $($wdkPackage.FullName)"

          $stampCandidates = Get-ChildItem $wdkPackage.FullName -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -notmatch '\\ARM64\\' }

          Write-Host 'Available non-ARM64 stampinf.exe files:'
          $stampCandidates | ForEach-Object { Write-Host $_.FullName }

          $stampX64 = $stampCandidates |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1

          if (-not $stampX64) {
            $stampX64 = $stampCandidates | Select-Object -First 1
          }

          if (-not $stampX64) {
            throw 'No non-ARM64 stampinf.exe was found in the restored WDK package.'
          }

          if ($stampX64.FullName -match '\\ARM64\\') {
            throw "Wrong architecture: selected ARM64 stampinf.exe: $($stampX64.FullName)"
          }

          $toolDirs = @($stampX64.Directory.FullName)

          foreach ($name in @('Inf2Cat.exe','signtool.exe','makecat.exe')) {
            $tool = Get-ChildItem $wdkPackage.FullName -Recurse -Filter $name -File |
              Where-Object { $_.FullName -notmatch '\\ARM64\\' } |
              Select-Object -First 1
            if ($tool) {
              Write-Host "$name : $($tool.FullName)"
              $toolDirs += $tool.Directory.FullName
            }
          }

          $toolDirs = $toolDirs | Select-Object -Unique

          # Make the tools available both to this PowerShell process and to later steps.
          foreach ($dir in $toolDirs) {
            Add-Content $env:GITHUB_PATH $dir
            $env:PATH = "$dir;$env:PATH"
          }

          # WDK 10.0.28000's InfVerif MSBuild task loads x86\\InfVerif.dll
          # relative to the WDK build directory. The x64 package does not
          # provide that DLL in the expected relative location, so supply it
          # from the matching x86 WDK package.
          $x86Root = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windows.wdk.x86'
          $x86VersionDir = Get-ChildItem $x86Root -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $x86VersionDir) {
            throw "Microsoft.Windows.WDK.x86 package was not restored."
          }

          $infVerifDll = Get-ChildItem $x86VersionDir.FullName -Recurse -Filter InfVerif.dll -File |
            Select-Object -First 1

          if (-not $infVerifDll) {
            throw "InfVerif.dll was not found in the x86 WDK package."
          }

          $wdkBuildDir = Join-Path $wdkPackage.FullName 'c\build\10.0.28000.0'
          $wdkBuildX86Dir = Join-Path $wdkBuildDir 'x86'
          New-Item -ItemType Directory -Force -Path $wdkBuildX86Dir | Out-Null
          Copy-Item $infVerifDll.FullName (Join-Path $wdkBuildX86Dir 'InfVerif.dll') -Force

          Write-Host "Supplied InfVerif.dll: $($infVerifDll.FullName)"
          Write-Host "InfVerif expected path: $wdkBuildX86Dir\InfVerif.dll"
          Write-Host "Selected x64 StampInf: $($stampX64.FullName)"
          Write-Host 'Resolved stampinf.exe:'
          Get-Command stampinf.exe -ErrorAction Stop | Select-Object -ExpandProperty Source

      - name: Build Driver (KMDF)
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
