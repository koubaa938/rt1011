name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages (MSBuild)
        # Using msbuild /t:restore handles <PackageReference> elements inside .vcxproj files
        run: msbuild /t:restore rt1011.sln /p:Configuration=Release /p:Platform=x64

      - name: WDK Diagnostics and Tool Path Verification
        shell: powershell
        run: |
          echo "=== MSBuild Properties Setup ==="
          
          # Query MSBuild properties directly, passing arguments explicitly instead of in a single string variable to avoid PowerShell parsing errors. Added -nologo to keep output clean.
          $platform = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:Platform /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $config = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:Configuration /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $winsdk = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:WindowsSdkDir /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $winsdkver = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:WindowsSDKVersion /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $wdkbin = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:WdkBinRoot /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $stampinf = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:StampInfToolPath /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          $inf2cat = msbuild rt1011/rt1011.vcxproj -nologo -getProperty:Inf2CatToolPath /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64
          
          echo "Platform: $platform"
          echo "Configuration: $config"
          echo "WindowsSdkDir: $winsdk"
          echo "WindowsSDKVersion: $winsdkver"
          echo "WdkBinRoot: $wdkbin"
          
          echo "=== Locating Exact WDK Tools ==="
          if (-not [string]::IsNullOrWhiteSpace($wdkbin) -and (Test-Path "$wdkbin")) {
             echo "Listing available StampInf binaries on disk:"
             Get-ChildItem -Path $wdkbin -Recurse -Filter "stampinf.exe" | Select-Object FullName
          }

          echo "Evaluated StampInf Path: $stampinf"
          echo "Evaluated Inf2Cat Path: $inf2cat"
          
          echo "=== Architecture Safety Check ==="
          if ($stampinf -match "ARM64") {
            Write-Error "Validation Failed: The workflow is configured to use the ARM64 stampinf.exe tool, which will trigger FileTracker error 0xd8!"
            exit 1
          } else {
            Write-Host "Validation Passed: ARM64 stampinf.exe is NOT selected. x64 host tool is properly enforced." -ForegroundColor Green
          }

      - name: Build Driver (KMDF)
        # The key fix: Enforce HostArchitecture so WDK targets use the x64 host tools instead of defaulting to ARM64
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64 /p:HostArchitecture=x64 /p:HostMachineOS=x64

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
