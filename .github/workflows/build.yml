name: Build RT1011 Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inject PackageReferences and Architecture Properties
        shell: powershell
        # This replaces the standalone `nuget install` step.
        # By setting RestoreProjectStyle to PackageReference, MSBuild will natively download 
        # the SDK/WDK packages during the restore step and automatically configure internal 
        # path variables (like WindowsSdkDir) to point to them instead of the system registry.
        run: |
          $props = @"
          <Project>
            <PropertyGroup>
              <RestoreProjectStyle>PackageReference</RestoreProjectStyle>
              <RestorePackagesProjectStyle>PackageReference</RestorePackagesProjectStyle>
              
              <WindowsTargetPlatformVersion>10.0.28000.0</WindowsTargetPlatformVersion>
              <HostArchitecture>x64</HostArchitecture>
              <HostMachineOS>x64</HostMachineOS>
            </PropertyGroup>
            
            <ItemGroup>
              <PackageReference Include="Microsoft.Windows.WDK.x64" Version="10.0.28000.2526" />
              <PackageReference Include="Microsoft.Windows.SDK.CPP.x64" Version="10.0.28000.2526" />
              <PackageReference Include="Microsoft.Windows.SDK.CPP" Version="10.0.28000.2526" />
            </ItemGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props

      - name: Restore NuGet Packages (MSBuild)
        # This step parses Directory.Build.props, downloads the packages, and generates 
        # the obj/project.assets.json file required to wire up the SDK headers and tools.
        run: |
          msbuild /t:restore rt1011.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Configure WDK host tools (x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wdkRoot = Join-Path $env:GITHUB_WORKSPACE 'packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\c'
          if (-not (Test-Path $wdkRoot)) {
            throw "WDK package root not found: $wdkRoot"
          }

          $stampX64 = Join-Path $wdkRoot 'bin\10.0.28000.0\x64\stampinf.exe'
          $stampArm64 = Join-Path $wdkRoot 'bin\10.0.28000.0\ARM64\stampinf.exe'
          if (-not (Test-Path $stampX64)) {
            $stampX64 = (Get-ChildItem $wdkRoot -Recurse -Filter stampinf.exe -File |
              Where-Object { $_.FullName -notmatch '\\ARM64\\' } |
              Select-Object -First 1).FullName
          }
          if (-not $stampX64 -or -not (Test-Path $stampX64)) {
            throw 'x64 stampinf.exe was not found in the WDK package.'
          }
          if ($stampX64 -match '\\ARM64\\') {
            throw "Wrong architecture: selected ARM64 stampinf.exe: $stampX64"
          }

          $toolDirs = @((Split-Path $stampX64 -Parent))
          foreach ($name in @('Inf2Cat.exe','signtool.exe','makecat.exe')) {
            $tool = Get-ChildItem $wdkRoot -Recurse -Filter $name -File |
              Where-Object { $_.FullName -notmatch '\\ARM64\\' } |
              Select-Object -First 1
            if ($tool) { $toolDirs += $tool.Directory.FullName }
          }

          $toolDirs | Select-Object -Unique | ForEach-Object { Add-Content $env:GITHUB_PATH $_ }
          Write-Host "Selected x64 stampinf: $stampX64"
          Write-Host "ARM64 stampinf (must NOT be selected): $stampArm64"
          Write-Host 'PATH entries added:'
          $toolDirs | Select-Object -Unique | ForEach-Object { Write-Host $_ }
          Write-Host 'Resolved stampinf:'
          where.exe stampinf.exe

      - name: Build Driver (KMDF)
        run: |
          msbuild rt1011.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload RT1011 Driver Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RT1011-Driver
          path: |
            **/x64/Release/**/*.sys
            **/x64/Release/**/*.inf
            **/x64/Release/**/*.cat
