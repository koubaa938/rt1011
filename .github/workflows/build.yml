name: Build RT1011 Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://go.microsoft.com/fwlink/?linkid=2284101'
          $installer = "$env:RUNNER_TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait
          $wdm = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Recurse -Filter wdm.h -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wdm) { throw 'WDK installation completed but wdm.h was not found.' }
          Write-Host "Found WDK header: $($wdm.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build RT1011 x64 Release
        shell: powershell
        run: |
          $wdm = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Recurse -Filter wdm.h -File | Select-Object -First 1
          $version = $wdm.Directory.Parent.Name
          Write-Host "WDK version: $version"
          msbuild 'rt1011.sln' /m /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:WindowsTargetPlatformVersion=$version

      - name: Package driver
        shell: powershell
        run: |
          $files = Get-ChildItem . -Recurse -File | Where-Object { $_.Name -in @('rt1011.sys','rt1011.inf','rt1011.cat') }
          $sys = $files | Where-Object Name -eq 'rt1011.sys'
          if (-not $sys) { throw 'rt1011.sys was not produced.' }
          New-Item -ItemType Directory -Force RT1011-Driver | Out-Null
          $files | ForEach-Object { Copy-Item $_.FullName RT1011-Driver -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: RT1011-Driver
          path: RT1011-Driver
