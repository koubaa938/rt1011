name: Build RT1011 Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Microsoft WDK NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\packages.config -PackagesDirectory .\packages
          $wdk = Get-ChildItem .\packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -First 1
          if (-not $wdk) { throw 'WDK NuGet package was not restored.' }
          Write-Host "WDK package: $($wdk.FullName)"

      - name: Add WDK tools to PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wdk = Get-ChildItem .\packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -First 1
          $stamp = Get-ChildItem $wdk.FullName -Recurse -Filter stampinf.exe -File | Select-Object -First 1
          if (-not $stamp) { throw 'stampinf.exe was not found inside the WDK NuGet package.' }
          $toolDirs = @(
            $stamp.Directory.FullName
          )
          $inf2cat = Get-ChildItem $wdk.FullName -Recurse -Filter Inf2Cat.exe -File | Select-Object -First 1
          if ($inf2cat) { $toolDirs += $inf2cat.Directory.FullName }
          $signtool = Get-ChildItem $wdk.FullName -Recurse -Filter signtool.exe -File | Select-Object -First 1
          if ($signtool) { $toolDirs += $signtool.Directory.FullName }

          Write-Host "stampinf: $($stamp.FullName)"
          if ($inf2cat) { Write-Host "Inf2Cat: $($inf2cat.FullName)" }
          if ($signtool) { Write-Host "signtool: $($signtool.FullName)" }

          $toolDirs | Select-Object -Unique | ForEach-Object {
            Add-Content $env:GITHUB_PATH $_
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build RT1011 x64 Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          where.exe stampinf.exe
          msbuild '.\rt1011.sln' /m /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

      - name: Verify and package driver
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sys = Get-ChildItem . -Recurse -Filter rt1011.sys -File | Select-Object -First 1
          if (-not $sys) { throw 'rt1011.sys was not produced.' }

          New-Item -ItemType Directory -Force RT1011-Driver | Out-Null
          Copy-Item $sys.FullName RT1011-Driver\rt1011.sys -Force
          Copy-Item .\rt1011\rt1011.inf RT1011-Driver\rt1011.inf -Force

          $cat = Get-ChildItem . -Recurse -Filter rt1011.cat -File | Select-Object -First 1
          if ($cat) {
            Copy-Item $cat.FullName RT1011-Driver\rt1011.cat -Force
          }

          Get-ChildItem RT1011-Driver | Select-Object Name,Length

      - name: Upload RT1011 driver
        uses: actions/upload-artifact@v4
        with:
          name: RT1011-Driver
          path: RT1011-Driver
